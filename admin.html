<script>
    // --- CONFIGURACIÓN ---
    // IMPORTANTE: Esta clave debe ser LA MISMA que pusiste en config.js
    const adminSecretKey = "artarona";
    // -------------------

    let leads = [];
    const API_URL = '/api/admin';

    document.addEventListener('DOMContentLoaded', function() {
        cargarLeads();
    });

    async function cargarLeads() {
        try {
            const response = await fetch(`${API_URL}/leads`, {
                headers: { 'x-admin-secret': adminSecretKey }
            });

            if (response.status === 401 || response.status === 403) {
                alert('Acceso denegado. La clave secreta es incorrecta.');
                throw new Error('Clave secreta incorrecta');
            }
            if (!response.ok) {
                throw new Error(`Error HTTP: ${response.status}`);
            }
            
            leads = await response.json();
            mostrarLeads();
            actualizarEstadisticas();
        } catch (error) {
            console.error("Error al cargar leads:", error);
            if (error.message !== 'Clave secreta incorrecta') {
                alert("No se pudieron cargar los leads. Revisa la consola para más detalles.");
            }
            mostrarLeadsVacios();
        }
    }

    async function limpiarLeads() {
        if (confirm('¿Estás seguro de que querés eliminar todos los leads?')) {
            try {
                const response = await fetch(`${API_URL}/leads`, {
                    method: 'DELETE',
                    headers: { 'x-admin-secret': adminSecretKey }
                });

                if (response.status === 401 || response.status === 403) {
                     alert('Acceso denegado. La clave secreta es incorrecta.');
                    throw new Error('Clave secreta incorrecta');
                }
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                alert('Leads eliminados correctamente');
                cargarLeads();
            } catch (error) {
                console.error("Error al limpiar los leads:", error);
                alert("No se pudieron eliminar los leads.");
            }
        }
    }

    // El resto de tus funciones (mostrarLeads, descargarExcel, etc.) no necesitan cambios.
    // Pega aquí el resto de las funciones que ya tenías en tu script original.
    function mostrarLeads() {
        const container = document.getElementById('leadsTableContainer');
        
        if (leads.length === 0) {
            mostrarLeadsVacios();
            return;
        }

        leads.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        let html = `
            <table class="leads-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Contacto</th>
                        <th>Operación</th>
                        <th>Tipo</th>
                        <th>Zona</th>
                        <th>Ambientes</th>
                        <th>Propiedades</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
        `;

        leads.forEach(lead => {
            const fecha = new Date(lead.timestamp).toLocaleDateString('es-AR');
            const hora = new Date(lead.timestamp).toLocaleTimeString('es-AR');
            
            const contactoParts = lead.contacto.split('-').map(part => part.trim());
            const nombre = contactoParts[0] || 'N/A';
            const telefono = contactoParts[1] || 'N/A';
            const email = contactoParts[2] || 'N/A';
            
            const badgeClass = `badge badge-${(lead.operacion || '').toLowerCase()}`;
            
            html += `
                <tr>
                    <td><strong>${fecha}</strong><br><small>${hora}</small></td>
                    <td><strong>${nombre}</strong><br><small>📞 ${telefono}</small><br><small>📧 ${email}</small></td>
                    <td><span class="${badgeClass}">${lead.operacion}</span></td>
                    <td>${lead.tipo || 'N/A'}</td>
                    <td>${lead.barrio || 'N/A'}</td>
                    <td>${lead.ambientes || 'N/A'}</td>
                    <td>${lead.propiedadesCoincidentes || 0}</td>
                    <td><button class="btn btn-primary" onclick="contactarLead('${telefono}', '${nombre}')" style="padding: 0.3rem 0.8rem; font-size: 0.8rem;">📞 Contactar</button></td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    function mostrarLeadsVacios() {
        const container = document.getElementById('leadsTableContainer');
        container.innerHTML = `<div class="empty-state"><div>📭</div><h3>No hay leads registrados</h3><p>Los leads del bot de WhatsApp aparecerán aquí.</p></div>`;
    }

    function actualizarEstadisticas() {
        const hoy = new Date().toDateString();
        const leadsHoy = leads.filter(lead => new Date(lead.timestamp).toDateString() === hoy);
        const leadsVenta = leads.filter(lead => lead.operacion === 'Venta');
        const leadsAlquiler = leads.filter(lead => lead.operacion === 'Alquiler');
        
        document.getElementById('totalLeads').textContent = leads.length;
        document.getElementById('leadsHoy').textContent = leadsHoy.length;
        document.getElementById('leadsVenta').textContent = leadsVenta.length;
        document.getElementById('leadsAlquiler').textContent = leadsAlquiler.length;
    }

    function descargarExcel() {
        if (leads.length === 0) {
            alert('No hay leads para descargar');
            return;
        }
        const datos = leads.map(lead => {
            const contactoParts = lead.contacto.split('-').map(part => part.trim());
            return {
                'Fecha': new Date(lead.timestamp).toLocaleDateString('es-AR'),
                'Hora': new Date(lead.timestamp).toLocaleTimeString('es-AR'),
                'Nombre': contactoParts[0] || '',
                'Teléfono': contactoParts[1] || '',
                'Email': contactoParts[2] || '',
                'Operación': lead.operacion,
                'Tipo Propiedad': lead.tipo || '',
                'Zona': lead.barrio || '',
                'Ambientes': lead.ambientes || '',
                'Rango Precio': lead.precio || '',
                'Propiedades Coincidentes': lead.propiedadesCoincidentes || 0
            };
        });
        const csv = convertirAExcel(datos);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `leads_dante_${new Date().toISOString().split('T')[0]}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function convertirAExcel(datos) {
        if (datos.length === 0) return '';
        const cabeceras = Object.keys(datos[0]);
        let csv = cabeceras.join(';') + '\n';
        datos.forEach(fila => {
            const valores = cabeceras.map(header => {
                let valor = fila[header] || '';
                if (typeof valor === 'string' && (valor.includes(';') || valor.includes('"'))) {
                    valor = `"${valor.replace(/"/g, '""')}"`;
                }
                return valor;
            });
            csv += valores.join(';') + '\n';
        });
        return csv;
    }

    function contactarLead(telefono, nombre) {
        const telefonoLimpio = telefono.replace(/[^\d+]/g, '');
        const mensaje = `Hola ${nombre}, soy de Dante Propiedades. Te contacto por tu interés en nuestras propiedades.`;
        const urlWhatsapp = `https://wa.me/${telefonoLimpio}?text=${encodeURIComponent(mensaje)}`;
        window.open(urlWhatsapp, '_blank');
    }

    setInterval(cargarLeads, 30000);
</script>
