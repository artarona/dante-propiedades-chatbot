<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dante Propiedades - Asistente Inmobiliario</title>
    <style>
        /* Estilos WhatsApp-like (actualizados) */
        :root {
            --whatsapp-green: #25D366;
            --whatsapp-dark: #075E54;
            --user-message: #DCF8C6;
            --bot-message: #FFFFFF;
            --timestamp: #999999;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #e5ddd5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: var(--whatsapp-dark);
            color: white;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }
        
        .header .subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .admin-link {
            position: absolute;
            right: 1rem;
            top: 1rem;
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            cursor: pointer;
        }
        
        .chat-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            background: #e5ddd5;
        }
        
        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .message {
            max-width: 85%;
            padding: 0.8rem 1rem;
            border-radius: 0.5rem;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .bot-message {
            background: var(--bot-message);
            align-self: flex-start;
            border-bottom-left-radius: 0.2rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .user-message {
            background: var(--user-message);
            align-self: flex-end;
            border-bottom-right-radius: 0.2rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .menu-options {
            background: var(--bot-message);
            padding: 1rem;
            margin-top: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid #e0e0e0;
        }
        
        .menu-item {
            padding: 0.8rem;
            margin: 0.3rem 0;
            border-left: 3px solid var(--whatsapp-green);
            background: #f8f9fa;
            border-radius: 0.3rem;
        }
        
        .menu-number {
            background: var(--whatsapp-green);
            color: white;
            width: 1.8rem;
            height: 1.8rem;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.8rem;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .input-container {
            display: flex;
            padding: 1rem;
            background: white;
            border-top: 1px solid #e0e0e0;
            gap: 0.5rem;
        }
        
        .input-container input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 2rem;
            outline: none;
            font-size: 1rem;
        }
        
        .input-container input:focus {
            border-color: var(--whatsapp-green);
        }
        
        .send-button {
            background: var(--whatsapp-green);
            color: white;
            border: none;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        
        .timestamp {
            font-size: 0.7rem;
            color: var(--timestamp);
            text-align: right;
            margin-top: 0.3rem;
        }

        /* Modal para clave de administración */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 2rem;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .modal h3 {
            margin-bottom: 1rem;
            color: var(--whatsapp-dark);
        }
        
        .modal-input {
            width: 100%;
            padding: 0.8rem;
            margin: 1rem 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        .modal-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }
        
        .modal-btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .modal-btn-primary {
            background: var(--whatsapp-green);
            color: white;
        }
        
        .modal-btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .error-message {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        /* ... (resto de estilos sin cambios) ... */
    </style>
</head>
<body>
    <!-- Modal para clave de administración -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h3>🔧 Acceso al Panel de Administración</h3>
            <p>Ingresá la clave de administración:</p>
            <input type="password" id="adminKeyInput" class="modal-input" placeholder="Clave de administración" autocomplete="off">
            <div id="adminKeyError" class="error-message">Clave incorrecta. Intentá nuevamente.</div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button class="modal-btn modal-btn-primary" onclick="verificarClaveAdmin()">Acceder</button>
            </div>
        </div>
    </div>

    <div class="header">
        <a href="#" class="admin-link" onclick="mostrarModalAdmin()">🔧 Admin</a>
        <h1>🏠 Dante Propiedades</h1>
        <div class="subtitle">Asistente Inmobiliario • En línea</div>
    </div>
    
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <!-- Los mensajes se cargan dinámicamente -->
        </div>
        
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Escribe el número de tu opción..." autocomplete="off">
            <button class="send-button" onclick="enviarMensaje()">➤</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN - Clave de administración
        const ADMIN_SECRET_KEY = "artarona";

        // Estado del chatbot
        let estado = 'inicio';
        let datosUsuario = {
            operacion: '',
            tipo: '',
            ambientes: '',
            barrio: '',
            precio: '',
            contacto: '',
            propiedadesCoincidentes: 0,
            perfilCompleto: false
        };
        
        let propiedades = [];
        let propiedadesFiltradas = [];
        let datosDinamicos = {
            barrios: [],
            tipos: [],
            operaciones: [],
            ambientes: []
        };

        // ==================== FUNCIONES BÁSICAS DEL CHAT ====================

        function agregarMensajeUsuario(texto) {
            const chatMessages = document.getElementById('chatMessages');
            const mensajeDiv = document.createElement('div');
            mensajeDiv.className = 'message user-message';
            mensajeDiv.innerHTML = `${texto}<div class="timestamp">${obtenerHoraActual()}</div>`;
            chatMessages.appendChild(mensajeDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function agregarMensajeBot(texto, opciones = null) {
            const chatMessages = document.getElementById('chatMessages');
            const mensajeDiv = document.createElement('div');
            mensajeDiv.className = 'message bot-message';
            
            let contenido = texto;
            if (opciones) contenido += `<div class="menu-options">${opciones}</div>`;
            contenido += `<div class="timestamp">${obtenerHoraActual()}</div>`;
            
            mensajeDiv.innerHTML = contenido;
            chatMessages.appendChild(mensajeDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function obtenerHoraActual() {
            return new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        }

        function enviarMensaje() {
            const input = document.getElementById('userInput');
            const mensaje = input.value.trim();
            
            if (!mensaje) return;

            agregarMensajeUsuario(mensaje);
            setTimeout(() => procesarRespuesta(mensaje), 500);
            input.value = '';
        }

        // ==================== FUNCIONES DE ADMINISTRACIÓN ====================

        function mostrarModalAdmin() {
            document.getElementById('adminModal').style.display = 'block';
            document.getElementById('adminKeyInput').focus();
            document.getElementById('adminKeyError').style.display = 'none';
        }

        function cerrarModal() {
            document.getElementById('adminModal').style.display = 'none';
            document.getElementById('adminKeyInput').value = '';
        }

        function verificarClaveAdmin() {
            const claveIngresada = document.getElementById('adminKeyInput').value;
            
            if (claveIngresada === ADMIN_SECRET_KEY) {
                // Clave correcta, redirigir al panel de administración
                window.location.href = 'admin.html';
            } else {
                // Clave incorrecta, mostrar error
                document.getElementById('adminKeyError').style.display = 'block';
                document.getElementById('adminKeyInput').value = '';
                document.getElementById('adminKeyInput').focus();
            }
        }

        // ==================== FUNCIONES DE DATOS DINÁMICOS ====================

        function extraerDatosDinamicos() {
            datosDinamicos.barrios = [...new Set(propiedades.map(p => p.barrio).filter(Boolean))];
            datosDinamicos.tipos = [...new Set(propiedades.map(p => p.tipo).filter(Boolean))];
            datosDinamicos.operaciones = [...new Set(propiedades.map(p => p.operacion).filter(Boolean))];
            
            // Extraer ambientes únicos y ordenar correctamente
            const ambientesUnicos = [...new Set(propiedades.map(p => p.ambientes).filter(amb => amb >= 0))].sort((a, b) => a - b);
            
            // Crear array de ambientes en el orden correcto
            const opcionesAmbientes = [];
            
            // Primero agregar Monoambiente si existe
            if (ambientesUnicos.includes(1)) {
                opcionesAmbientes.push({valor: 1, texto: 'Monoambiente'});
            }
            
            // Luego agregar 2 ambientes si existe
            if (ambientesUnicos.includes(2)) {
                opcionesAmbientes.push({valor: 2, texto: '2 ambientes'});
            }
            
            // Luego agregar 3 ambientes si existe
            if (ambientesUnicos.includes(3)) {
                opcionesAmbientes.push({valor: 3, texto: '3 ambientes'});
            }
            
            // Luego agregar "Más de 3 ambientes" para 4 o más
            const ambientesMasDe3 = ambientesUnicos.filter(amb => amb >= 4);
            if (ambientesMasDe3.length > 0) {
                opcionesAmbientes.push({valor: 4, texto: 'Más de 3 ambientes'});
            }
            
            // Finalmente "No aplica" si existe 0
            if (ambientesUnicos.includes(0)) {
                opcionesAmbientes.push({valor: 0, texto: 'No aplica'});
            }
            
            datosDinamicos.ambientes = opcionesAmbientes;
            
            console.log('📊 Datos extraídos:', datosDinamicos);
        }

        // ==================== FUNCIONES DE MENÚ Y NAVEGACIÓN ====================

        function mostrarMenuInicio() {
            estado = 'inicio';
            
            let opcionesHTML = '';
            datosDinamicos.operaciones.forEach((operacion, index) => {
                const numero = (index + 1).toString();
                const operacionFormateada = operacion.charAt(0).toUpperCase() + operacion.slice(1);
                opcionesHTML += `
                    <div class="menu-item">
                        <span class="menu-number">${numero}</span>${operacionFormateada}
                    </div>
                `;
            });
            
            if (datosDinamicos.operaciones.length < 4) {
                const numeroOtros = (datosDinamicos.operaciones.length + 1).toString();
                opcionesHTML += `
                    <div class="menu-item">
                        <span class="menu-number">${numeroOtros}</span>Otros
                    </div>
                `;
            }
            
            agregarMensajeBot(
                `¡Hola! Soy el asistente inmobiliario de Dante Propiedades. 😊<br><br>
                <strong>Decime qué necesitás:</strong><br>
                <em>Escribí el número de tu opción</em>`,
                opcionesHTML
            );
        }

        function mostrarMenuTipoPropiedad() {
            estado = 'tipo_propiedad';
            
            let opcionesHTML = '';
            datosDinamicos.tipos.forEach((tipo, index) => {
                const numero = (index + 1).toString();
                const tipoFormateado = tipo.charAt(0).toUpperCase() + tipo.slice(1);
                opcionesHTML += `
                    <div class="menu-item">
                        <span class="menu-number">${numero}</span>${tipoFormateado}
                    </div>
                `;
            });
            
            if (datosDinamicos.tipos.length < 5) {
                const numeroOtros = (datosDinamicos.tipos.length + 1).toString();
                opcionesHTML += `
                    <div class="menu-item">
                        <span class="menu-number">${numeroOtros}</span>Otros
                    </div>
                `;
            }
            
            agregarMensajeBot(
                `🏠 <strong>¿Qué tipo de propiedad te interesa?</strong><br>
                <em>Escribí el número correspondiente</em>`,
                opcionesHTML
            );
        }

        function mostrarMenuAmbientes() {
            estado = 'ambientes';
            
            let opcionesHTML = '';
            
            datosDinamicos.ambientes.forEach((ambienteObj, index) => {
                const numero = (index + 1).toString();
                opcionesHTML += `
                    <div class="menu-item">
                        <span class="menu-number">${numero}</span>${ambienteObj.texto}
                    </div>
                `;
            });
            
            agregarMensajeBot(
                `🛏️ <strong>¿Cuántos ambientes necesitás?</strong><br>
                <em>Escribí el número correspondiente</em>`,
                opcionesHTML
            );
        }

        function mostrarMenuBarrio() {
            estado = 'barrio';
            
            let opcionesHTML = '';
            
            datosDinamicos.barrios.forEach((barrio, index) => {
                const numero = (index + 1).toString();
                opcionesHTML += `
                    <div class="menu-item">
                        <span class="menu-number">${numero}</span>${barrio}
                    </div>
                `;
            });
            
            const numeroOtraZona = (datosDinamicos.barrios.length + 1).toString();
            opcionesHTML += `
                <div class="menu-item">
                    <span class="menu-number">${numeroOtraZona}</span>Otra zona
                </div>
            `;
            
            agregarMensajeBot(
                `📍 <strong>¿En qué zona buscás?</strong><br>
                <em>Escribí el número correspondiente</em>`,
                opcionesHTML
            );
        }

        function mostrarMenuPrecio() {
            estado = 'precio';
            
            const esVenta = datosUsuario.operacion === 'venta';
            const moneda = esVenta ? 'U$D' : '$';
            
            const rangos = esVenta ? 
                [
                    'Hasta U$D 100.000',
                    'U$D 100.000 - 200.000', 
                    'U$D 200.000 - 500.000',
                    'Más de U$D 500.000'
                ] : [
                    'Hasta $ 100.000',
                    '$ 100.000 - 200.000',
                    '$ 200.000 - 500.000', 
                    'Más de $ 500.000'
                ];
            
            let opcionesHTML = '';
            rangos.forEach((rango, index) => {
                const numero = (index + 1).toString();
                opcionesHTML += `
                    <div class="menu-item">
                        <span class="menu-number">${numero}</span>${rango}
                    </div>
                `;
            });
            
            const numeroConsultar = (rangos.length + 1).toString();
            opcionesHTML += `
                <div class="menu-item">
                    <span class="menu-number">${numeroConsultar}</span>Consultar precio
                </div>
            `;
            
            agregarMensajeBot(
                `💰 <strong>¿Qué rango de precio tenés en mente?</strong><br>
                <em>Escribí el número correspondiente</em>`,
                opcionesHTML
            );
        }

        // ==================== FUNCIONES DE PROCESAMIENTO ====================

        function procesarRespuesta(mensaje) {
            console.log('Procesando mensaje:', mensaje, 'Estado actual:', estado);
            
            switch (estado) {
                case 'inicio':
                    procesarInicio(mensaje);
                    break;
                case 'tipo_propiedad':
                    procesarTipoPropiedad(mensaje);
                    break;
                case 'ambientes':
                    procesarAmbientes(mensaje);
                    break;
                case 'barrio':
                    procesarBarrio(mensaje);
                    break;
                case 'barrio_texto':
                    procesarBarrioTexto(mensaje);
                    break;
                case 'precio':
                    procesarPrecio(mensaje);
                    break;
                case 'contacto':
                    procesarContacto(mensaje);
                    break;
                case 'interes_detectado':
                    procesarInteresDetectado(mensaje);
                    break;
                case 'agendar_visita':
                case 'contactar_asesor':
                    procesarContacto(mensaje);
                    break;
                default:
                    agregarMensajeBot('❌ Estado no reconocido. Reiniciando chat...');
                    reiniciarChat();
            }
        }

        function procesarInicio(mensaje) {
            const maxOpciones = datosDinamicos.operaciones.length;
            const opcionesValidas = Array.from({length: maxOpciones}, (_, i) => (i + 1).toString());
            
            if (datosDinamicos.operaciones.length < 4) {
                opcionesValidas.push((maxOpciones + 1).toString());
            }
            
            if (opcionesValidas.includes(mensaje)) {
                const indice = parseInt(mensaje) - 1;
                
                if (indice < datosDinamicos.operaciones.length) {
                    datosUsuario.operacion = datosDinamicos.operaciones[indice];
                    estado = 'tipo_propiedad';
                    agregarMensajeBot(`✅ Elegiste: <strong>${datosUsuario.operacion.charAt(0).toUpperCase() + datosUsuario.operacion.slice(1)}</strong>`);
                    mostrarMenuTipoPropiedad();
                } else {
                    datosUsuario.operacion = 'otros';
                    estado = 'contacto';
                    agregarMensajeBot(`✅ Elegiste: <strong>Otros</strong>`);
                    mostrarResumenSeleccion();
                }
            } else {
                agregarMensajeBot(`❌ Por favor, respondé con el número de tu opción (1-${opcionesValidas.length})`);
                mostrarMenuInicio();
            }
        }

        function procesarTipoPropiedad(mensaje) {
            const maxOpciones = datosDinamicos.tipos.length;
            const opcionesValidas = Array.from({length: maxOpciones}, (_, i) => (i + 1).toString());
            
            if (datosDinamicos.tipos.length < 5) {
                opcionesValidas.push((maxOpciones + 1).toString());
            }
            
            if (opcionesValidas.includes(mensaje)) {
                const indice = parseInt(mensaje) - 1;
                
                if (indice < datosDinamicos.tipos.length) {
                    datosUsuario.tipo = datosDinamicos.tipos[indice];
                    estado = 'ambientes';
                    agregarMensajeBot(`✅ ${datosUsuario.tipo.charAt(0).toUpperCase() + datosUsuario.tipo.slice(1)} — elegí el tipo:`);
                    mostrarMenuAmbientes();
                } else {
                    datosUsuario.tipo = 'otros';
                    estado = 'barrio';
                    agregarMensajeBot(`✅ Otros tipos de propiedad`);
                    mostrarMenuBarrio();
                }
            } else {
                agregarMensajeBot(`❌ Por favor, elegí una opción del 1 al ${opcionesValidas.length}`);
                mostrarMenuTipoPropiedad();
            }
        }

        function procesarAmbientes(mensaje) {
            const maxOpciones = datosDinamicos.ambientes.length;
            const opcionesValidas = Array.from({length: maxOpciones}, (_, i) => (i + 1).toString());
            
            if (opcionesValidas.includes(mensaje)) {
                const indice = parseInt(mensaje) - 1;
                const ambienteObj = datosDinamicos.ambientes[indice];
                datosUsuario.ambientes = ambienteObj.texto;
                datosUsuario.ambientesNumero = ambienteObj.valor;
                
                estado = 'barrio';
                agregarMensajeBot(`✅ ${datosUsuario.ambientes}`);
                mostrarMenuBarrio();
            } else {
                agregarMensajeBot(`❌ Por favor, elegí una opción del 1 al ${maxOpciones}`);
                mostrarMenuAmbientes();
            }
        }

        function procesarBarrio(mensaje) {
            const maxOpciones = datosDinamicos.barrios.length + 1;
            const opcionesValidas = Array.from({length: maxOpciones}, (_, i) => (i + 1).toString());
            
            if (opcionesValidas.includes(mensaje)) {
                const indice = parseInt(mensaje) - 1;
                
                if (indice < datosDinamicos.barrios.length) {
                    datosUsuario.barrio = datosDinamicos.barrios[indice];
                    estado = 'precio';
                    agregarMensajeBot(`✅ Zona: ${datosUsuario.barrio}`);
                    mostrarMenuPrecio();
                } else {
                    agregarMensajeBot('📝 Escribí la zona que te interesa:');
                    estado = 'barrio_texto';
                }
            } else {
                agregarMensajeBot(`❌ Por favor, elegí una opción del 1 al ${maxOpciones}`);
                mostrarMenuBarrio();
            }
        }

        function procesarBarrioTexto(mensaje) {
            if (mensaje.trim().length > 0) {
                datosUsuario.barrio = mensaje;
                estado = 'precio';
                agregarMensajeBot(`✅ Zona: ${datosUsuario.barrio}`);
                mostrarMenuPrecio();
            } else {
                agregarMensajeBot('❌ Por favor, escribí la zona que te interesa');
            }
        }

        function procesarPrecio(mensaje) {
            const precios = ['1', '2', '3', '4', '5'];
            
            if (precios.includes(mensaje)) {
                datosUsuario.precio = mensaje;
                
                // MOSTRAR RESUMEN ANTES DE CONTINUAR
                mostrarResumenSeleccion();
                
            } else {
                agregarMensajeBot('❌ Por favor, elegí una opción del 1 al 5');
                mostrarMenuPrecio();
            }
        }

        // ==================== INICIALIZACIÓN ====================

        document.addEventListener('DOMContentLoaded', function() {
            // Inicializar eventos
            document.getElementById('userInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    enviarMensaje();
                }
            });
            
            document.getElementById('adminKeyInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    verificarClaveAdmin();
                }
            });
            
            // Cerrar modal al hacer click fuera
            window.addEventListener('click', function(event) {
                const modal = document.getElementById('adminModal');
                if (event.target === modal) {
                    cerrarModal();
                }
            });
            
            // Cargar propiedades
            fetch('propiedades.json')
                .then(response => response.json())
                .then(data => {
                    propiedades = data;
                    console.log('✅ Propiedades cargadas:', propiedades.length);
                    extraerDatosDinamicos();
                    mostrarMenuInicio();
                })
                .catch(error => {
                    console.error('❌ Error cargando propiedades:', error);
