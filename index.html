<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dante Propiedades - Asistente Inmobiliario</title>
    <style>
        /* Estilos WhatsApp-like (actualizados) */
        :root {
            --whatsapp-green: #25D366;
            --whatsapp-dark: #075E54;
            --user-message: #DCF8C6;
            --bot-message: #FFFFFF;
            --timestamp: #999999;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #e5ddd5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: var(--whatsapp-dark);
            color: white;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }
        
        .header .subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .admin-link {
            position: absolute;
            right: 1rem;
            top: 1rem;
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            cursor: pointer;
        }
        
        .chat-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            background: #e5ddd5;
        }
        
        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .message {
            max-width: 85%;
            padding: 0.8rem 1rem;
            border-radius: 0.5rem;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .bot-message {
            background: var(--bot-message);
            align-self: flex-start;
            border-bottom-left-radius: 0.2rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .user-message {
            background: var(--user-message);
            align-self: flex-end;
            border-bottom-right-radius: 0.2rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .menu-options {
            background: var(--bot-message);
            padding: 1rem;
            margin-top: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid #e0e0e0;
        }
        
        .menu-item {
            padding: 0.8rem;
            margin: 0.3rem 0;
            border-left: 3px solid var(--whatsapp-green);
            background: #f8f9fa;
            border-radius: 0.3rem;
        }
        
        .menu-number {
            background: var(--whatsapp-green);
            color: white;
            width: 1.8rem;
            height: 1.8rem;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.8rem;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .input-container {
            display: flex;
            padding: 1rem;
            background: white;
            border-top: 1px solid #e0e0e0;
            gap: 0.5rem;
        }
        
        .input-container input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 2rem;
            outline: none;
            font-size: 1rem;
        }
        
        .input-container input:focus {
            border-color: var(--whatsapp-green);
        }
        
        .send-button {
            background: var(--whatsapp-green);
            color: white;
            border: none;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        
        .timestamp {
            font-size: 0.7rem;
            color: var(--timestamp);
            text-align: right;
            margin-top: 0.3rem;
        }

        /* Modal para clave de administración */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 2rem;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .modal h3 {
            margin-bottom: 1rem;
            color: var(--whatsapp-dark);
        }
        
        .modal-input {
            width: 100%;
            padding: 0.8rem;
            margin: 1rem 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        .modal-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }
        
        .modal-btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .modal-btn-primary {
            background: var(--whatsapp-green);
            color: white;
        }
        
        .modal-btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .error-message {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        /* ... (resto de estilos sin cambios) ... */
    </style>
</head>
<body>
    <!-- Modal para clave de administración -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h3>🔧 Acceso al Panel de Administración</h3>
            <p>Ingresá la clave de administración:</p>
            <input type="password" id="adminKeyInput" class="modal-input" placeholder="Clave de administración" autocomplete="off">
            <div id="adminKeyError" class="error-message">Clave incorrecta. Intentá nuevamente.</div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button class="modal-btn modal-btn-primary" onclick="verificarClaveAdmin()">Acceder</button>
            </div>
        </div>
    </div>

    <div class="header">
        <a href="#" class="admin-link" onclick="mostrarModalAdmin()">🔧 Admin</a>
        <h1>🏠 Dante Propiedades</h1>
        <div class="subtitle">Asistente Inmobiliario • En línea</div>
    </div>
    
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <!-- Los mensajes se cargan dinámicamente -->
        </div>
        
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Escribe el número de tu opción..." autocomplete="off">
            <button class="send-button" onclick="enviarMensaje()">➤</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN - Clave de administración
        const ADMIN_SECRET_KEY = "artarona";

        // Estado del chatbot
        let estado = 'inicio';
        let datosUsuario = {
            operacion: '',
            tipo: '',
            ambientes: '',
            barrio: '',
            precio: '',
            contacto: '',
            propiedadesCoincidentes: 0,
            perfilCompleto: false
        };
        
        let propiedades = [];
        let propiedadesFiltradas = [];
        let datosDinamicos = {
            barrios: [],
            tipos: [],
            operaciones: [],
            ambientes: []
        };

        // Funciones para el modal de administración
        function mostrarModalAdmin() {
            document.getElementById('adminModal').style.display = 'block';
            document.getElementById('adminKeyInput').focus();
            document.getElementById('adminKeyError').style.display = 'none';
        }

        function cerrarModal() {
            document.getElementById('adminModal').style.display = 'none';
            document.getElementById('adminKeyInput').value = '';
        }

        function verificarClaveAdmin() {
            const claveIngresada = document.getElementById('adminKeyInput').value;
            
            if (claveIngresada === ADMIN_SECRET_KEY) {
                // Clave correcta, redirigir al panel de administración
                window.location.href = 'admin.html';
            } else {
                // Clave incorrecta, mostrar error
                document.getElementById('adminKeyError').style.display = 'block';
                document.getElementById('adminKeyInput').value = '';
                document.getElementById('adminKeyInput').focus();
            }
        }

        // Permitir Enter en el modal
        document.getElementById('adminKeyInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verificarClaveAdmin();
            }
        });

        // Cerrar modal al hacer click fuera
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('adminModal');
            if (event.target === modal) {
                cerrarModal();
            }
        });

        // ... (resto del código del chatbot sin cambios) ...

        // Cargar propiedades y extraer datos dinámicos
        fetch('propiedades.json')
            .then(response => response.json())
            .then(data => {
                propiedades = data;
                console.log('✅ Propiedades cargadas:', propiedades.length);
                extraerDatosDinamicos();
                mostrarMenuInicio();
            })
            .catch(error => {
                console.error('❌ Error cargando propiedades:', error);
                agregarMensajeBot('❌ Error cargando las propiedades. Por favor, recarga la página.');
            });

        // ... (resto del código JavaScript del chatbot permanece igual) ...
    </script>
</body>
</html>
