<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dante Propiedades - Asistente Inmobiliario</title>
    <style>
        /* Estilos WhatsApp-like (igual que antes) */
        :root {
            --whatsapp-green: #25D366;
            --whatsapp-dark: #075E54;
            --user-message: #DCF8C6;
            --bot-message: #FFFFFF;
            --timestamp: #999999;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #e5ddd5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: var(--whatsapp-dark);
            color: white;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }
        
        .header .subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .admin-link {
            position: absolute;
            right: 1rem;
            top: 1rem;
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
        }
        
        .chat-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            background: #e5ddd5;
        }
        
        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .message {
            max-width: 85%;
            padding: 0.8rem 1rem;
            border-radius: 0.5rem;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .bot-message {
            background: var(--bot-message);
            align-self: flex-start;
            border-bottom-left-radius: 0.2rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .user-message {
            background: var(--user-message);
            align-self: flex-end;
            border-bottom-right-radius: 0.2rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .menu-options {
            background: var(--bot-message);
            padding: 1rem;
            margin-top: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid #e0e0e0;
        }
        
        .menu-item {
            padding: 0.8rem;
            margin: 0.3rem 0;
            border-left: 3px solid var(--whatsapp-green);
            background: #f8f9fa;
            border-radius: 0.3rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .menu-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }
        
        .menu-number {
            background: var(--whatsapp-green);
            color: white;
            width: 1.8rem;
            height: 1.8rem;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.8rem;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .input-container {
            display: flex;
            padding: 1rem;
            background: white;
            border-top: 1px solid #e0e0e0;
            gap: 0.5rem;
        }
        
        .input-container input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 2rem;
            outline: none;
            font-size: 1rem;
        }
        
        .input-container input:focus {
            border-color: var(--whatsapp-green);
        }
        
        .send-button {
            background: var(--whatsapp-green);
            color: white;
            border: none;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        
        .timestamp {
            font-size: 0.7rem;
            color: var(--timestamp);
            text-align: right;
            margin-top: 0.3rem;
        }
        
        .quick-actions {
            display: flex;
            gap: 0.5rem;
            padding: 0 1rem 1rem;
            flex-wrap: wrap;
        }
        
        .quick-btn {
            background: white;
            border: 1px solid var(--whatsapp-green);
            color: var(--whatsapp-green);
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        
        .quick-btn:hover {
            background: var(--whatsapp-green);
            color: white;
        }
        
        .results-grid {
            display: grid;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .property-card {
            border: 1px solid #ddd;
            border-radius: 0.5rem;
            overflow: hidden;
            background: white;
        }
        
        .property-header {
            background: #f8f9fa;
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }
        
        .property-details {
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .message {
                max-width: 95%;
            }
            
            .property-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="admin.html" class="admin-link">🔧 Admin</a>
        <h1>🏠 Dante Propiedades</h1>
        <div class="subtitle">Asistente Inmobiliario • En línea</div>
    </div>
    
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <!-- Los mensajes se cargan dinámicamente -->
        </div>
        
        <div class="quick-actions" id="quickActions">
            <!-- Botones rápidos se cargan dinámicamente -->
        </div>
        
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Escribe tu respuesta..." autocomplete="off">
            <button class="send-button" onclick="enviarMensaje()">➤</button>
        </div>
    </div>

    <script>
        // Estado del chatbot
        let estado = 'inicio';
        let datosUsuario = {
            operacion: '',
            tipo: '',
            ambientes: '',
            barrio: '',
            precio: '',
            contacto: '',
            propiedadesCoincidentes: 0
        };
        
        let propiedades = [];
        let propiedadesFiltradas = [];
        
        // Datos dinámicos extraídos del JSON
        let datosDinamicos = {
            barrios: [],
            tipos: [],
            operaciones: [],
            ambientes: []
        };

        // Cargar propiedades y extraer datos dinámicos
        fetch('propiedades.json')
            .then(response => response.json())
            .then(data => {
                propiedades = data;
                console.log('✅ Propiedades cargadas:', propiedades.length);
                
                // Extraer datos dinámicos del JSON
                extraerDatosDinamicos();
                
                // Iniciar chat después de cargar los datos
                mostrarMenuInicio();
            })
            .catch(error => {
                console.error('❌ Error cargando propiedades:', error);
                // Mostrar mensaje de error al usuario
                agregarMensajeBot('❌ Error cargando las propiedades. Por favor, recarga la página.');
            });

        function extraerDatosDinamicos() {
            // Extraer barrios únicos
            datosDinamicos.barrios = [...new Set(propiedades.map(p => p.barrio).filter(Boolean))];
            
            // Extraer tipos de propiedad únicos
            datosDinamicos.tipos = [...new Set(propiedades.map(p => p.tipo).filter(Boolean))];
            
            // Extraer operaciones únicas
            datosDinamicos.operaciones = [...new Set(propiedades.map(p => p.operacion).filter(Boolean))];
            
            // Extraer ambientes únicos y ordenarlos
            datosDinamicos.ambientes = [...new Set(propiedades.map(p => p.ambientes).filter(amb => amb > 0))].sort((a, b) => a - b);
            
            console.log('📊 Datos dinámicos extraídos:', datosDinamicos);
        }

        // Inicializar chat después de cargar datos
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('userInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    enviarMensaje();
                }
            });
            
            document.getElementById('userInput').focus();
        });

        function enviarMensaje() {
            const input = document.getElementById('userInput');
            const mensaje = input.value.trim();
            
            if (!mensaje) return;

            // Mostrar mensaje del usuario
            agregarMensajeUsuario(mensaje);
            
            // Procesar respuesta después de un delay
            setTimeout(() => procesarRespuesta(mensaje), 500);
            
            input.value = '';
        }

        function agregarMensajeUsuario(texto) {
            const chatMessages = document.getElementById('chatMessages');
            const mensajeDiv = document.createElement('div');
            mensajeDiv.className = 'message user-message';
            mensajeDiv.innerHTML = `
                ${texto}
                <div class="timestamp">${obtenerHoraActual()}</div>
            `;
            chatMessages.appendChild(mensajeDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function agregarMensajeBot(texto, opciones = null) {
            const chatMessages = document.getElementById('chatMessages');
            const mensajeDiv = document.createElement('div');
            mensajeDiv.className = 'message bot-message';
            
            let contenido = texto;
            if (opciones) {
                contenido += `<div class="menu-options">${opciones}</div>`;
            }
            
            contenido += `<div class="timestamp">${obtenerHoraActual()}</div>`;
            mensajeDiv.innerHTML = contenido;
            
            chatMessages.appendChild(mensajeDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function obtenerHoraActual() {
            return new Date().toLocaleTimeString('es-AR', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        function mostrarMenuInicio() {
            estado = 'inicio';
            
            // Generar opciones dinámicamente desde las operaciones disponibles
            let opcionesHTML = '';
            datosDinamicos.operaciones.forEach((operacion, index) => {
                const numero = (index + 1).toString();
                const operacionFormateada = operacion.charAt(0).toUpperCase() + operacion.slice(1);
                opcionesHTML += `
                    <div class="menu-item" onclick="seleccionarOpcion('${numero}')">
                        <span class="menu-number">${numero}</span>${operacionFormateada}
                    </div>
                `;
            });
            
            // Agregar opción "Otros" si no hay muchas operaciones
            if (datosDinamicos.operaciones.length < 4) {
                const numeroOtros = (datosDinamicos.operaciones.length + 1).toString();
                opcionesHTML += `
                    <div class="menu-item" onclick="seleccionarOpcion('${numeroOtros}')">
                        <span class="menu-number">${numeroOtros}</span>Otros
                    </div>
                `;
            }
            
            agregarMensajeBot(
                `¡Hola! Soy el asistente inmobiliario de Dante Propiedades. 😊<br><br>
                <strong>Decime qué necesitás:</strong>`,
                opcionesHTML
            );
            
            const opcionesRapidas = datosDinamicos.operaciones.map((_, index) => (index + 1).toString());
            if (datosDinamicos.operaciones.length < 4) {
                opcionesRapidas.push((datosDinamicos.operaciones.length + 1).toString());
            }
            actualizarBotonesRapidos(opcionesRapidas);
        }

        function seleccionarOpcion(numero) {
            document.getElementById('userInput').value = numero;
            enviarMensaje();
        }

        function procesarRespuesta(mensaje) {
            switch (estado) {
                case 'inicio':
                    procesarInicio(mensaje);
                    break;
                case 'tipo_propiedad':
                    procesarTipoPropiedad(mensaje);
                    break;
                case 'ambientes':
                    procesarAmbientes(mensaje);
                    break;
                case 'barrio':
                    procesarBarrio(mensaje);
                    break;
                case 'barrio_texto':
                    procesarBarrioTexto(mensaje);
                    break;
                case 'precio':
                    procesarPrecio(mensaje);
                    break;
                case 'contacto':
                    procesarContacto(mensaje);
                    break;
                case 'final':
                    procesarFinal(mensaje);
                    break;
            }
        }

        function procesarInicio(mensaje) {
            const maxOpciones = datosDinamicos.operaciones.length;
            const opcionesValidas = Array.from({length: maxOpciones}, (_, i) => (i + 1).toString());
            
            // Si hay opción "Otros"
            if (datosDinamicos.operaciones.length < 4) {
                opcionesValidas.push((maxOpciones + 1).toString());
            }
            
            if (opcionesValidas.includes(mensaje)) {
                const indice = parseInt(mensaje) - 1;
                
                if (indice < datosDinamicos.operaciones.length) {
                    datosUsuario.operacion = datosDinamicos.operaciones[indice];
                    estado = 'tipo_propiedad';
                    agregarMensajeBot(`✅ Elegiste: <strong>${datosUsuario.operacion.charAt(0).toUpperCase() + datosUsuario.operacion.slice(1)}</strong>`);
                    mostrarMenuTipoPropiedad();
                } else {
                    // Opción "Otros"
                    datosUsuario.operacion = 'otros';
                    estado = 'contacto';
                    agregarMensajeBot(`✅ Elegiste: <strong>Otros</strong>`);
                    solicitarContacto();
                }
            } else {
                agregarMensajeBot(`❌ Por favor, respondé con el número de tu opción (1-${opcionesValidas.length})`);
                mostrarMenuInicio();
            }
        }

        function mostrarMenuTipoPropiedad() {
            estado = 'tipo_propiedad';
            
            let opcionesHTML = '';
            datosDinamicos.tipos.forEach((tipo, index) => {
                const numero = (index + 1).toString();
                const tipoFormateado = tipo.charAt(0).toUpperCase() + tipo.slice(1);
                opcionesHTML += `
                    <div class="menu-item" onclick="seleccionarOpcion('${numero}')">
                        <span class="menu-number">${numero}</span>${tipoFormateado}
                    </div>
                `;
            });
            
            // Agregar opción "Otros" si no hay muchos tipos
            if (datosDinamicos.tipos.length < 5) {
                const numeroOtros = (datosDinamicos.tipos.length + 1).toString();
                opcionesHTML += `
                    <div class="menu-item" onclick="seleccionarOpcion('${numeroOtros}')">
                        <span class="menu-number">${numeroOtros}</span>Otros
                    </div>
                `;
            }
            
            agregarMensajeBot(
                `🏠 <strong>¿Qué tipo de propiedad te interesa?</strong>`,
                opcionesHTML
            );
            
            const opcionesRapidas = datosDinamicos.tipos.map((_, index) => (index + 1).toString());
            if (datosDinamicos.tipos.length < 5) {
                opcionesRapidas.push((datosDinamicos.tipos.length + 1).toString());
            }
            actualizarBotonesRapidos(opcionesRapidas);
        }

        function procesarTipoPropiedad(mensaje) {
            const maxOpciones = datosDinamicos.tipos.length;
            const opcionesValidas = Array.from({length: maxOpciones}, (_, i) => (i + 1).toString());
            
            // Si hay opción "Otros"
            if (datosDinamicos.tipos.length < 5) {
                opcionesValidas.push((maxOpciones + 1).toString());
            }
            
            if (opcionesValidas.includes(mensaje)) {
                const indice = parseInt(mensaje) - 1;
                
                if (indice < datosDinamicos.tipos.length) {
                    datosUsuario.tipo = datosDinamicos.tipos[indice];
                    estado = 'ambientes';
                    agregarMensajeBot(`✅ ${datosUsuario.tipo.charAt(0).toUpperCase() + datosUsuario.tipo.slice(1)} — elegí el tipo:`);
                    mostrarMenuAmbientes();
                } else {
                    // Opción "Otros"
                    datosUsuario.tipo = 'otros';
                    estado = 'barrio';
                    agregarMensajeBot(`✅ Otros tipos de propiedad`);
                    mostrarMenuBarrio();
                }
            } else {
                agregarMensajeBot(`❌ Por favor, elegí una opción del 1 al ${opcionesValidas.length}`);
                mostrarMenuTipoPropiedad();
            }
        }

        function mostrarMenuAmbientes() {
            let opcionesHTML = '';
            
            // Generar opciones de ambientes desde los datos disponibles
            datosDinamicos.ambientes.forEach((ambiente, index) => {
                const numero = (index + 1).toString();
                const textoAmbiente = ambiente === 1 ? 'Monoambiente' : `${ambiente} ambientes`;
                opcionesHTML += `
                    <div class="menu-item" onclick="seleccionarOpcion('${numero}')">
                        <span class="menu-number">${numero}</span>${textoAmbiente}
                    </div>
                `;
            });
            
            // Agregar opción "No aplica" para terrenos, oficinas, etc.
            const numeroNoAplica = (datosDinamicos.ambientes.length + 1).toString();
            opcionesHTML += `
                <div class="menu-item" onclick="seleccionarOpcion('${numeroNoAplica}')">
                    <span class="menu-number">${numeroNoAplica}</span>No aplica
                </div>
            `;
            
            agregarMensajeBot(
                `🛏️ <strong>¿Cuántos ambientes necesitás?</strong>`,
                opcionesHTML
            );
            
            const opcionesRapidas = datosDinamicos.ambientes.map((_, index) => (index + 1).toString());
            opcionesRapidas.push((datosDinamicos.ambientes.length + 1).toString());
            actualizarBotonesRapidos(opcionesRapidas);
        }

        function procesarAmbientes(mensaje) {
            const maxOpciones = datosDinamicos.ambientes.length + 1; // +1 por "No aplica"
            const opcionesValidas = Array.from({length: maxOpciones}, (_, i) => (i + 1).toString());
            
            if (opcionesValidas.includes(mensaje)) {
                const indice = parseInt(mensaje) - 1;
                
                if (indice < datosDinamicos.ambientes.length) {
                    const ambiente = datosDinamicos.ambientes[indice];
                    datosUsuario.ambientes = ambiente === 1 ? 'Monoambiente' : `${ambiente} ambientes`;
                } else {
                    datosUsuario.ambientes = 'No aplica';
                }
                
                estado = 'barrio';
                agregarMensajeBot(`✅ ${datosUsuario.ambientes}`);
                mostrarMenuBarrio();
            } else {
                agregarMensajeBot(`❌ Por favor, elegí una opción del 1 al ${maxOpciones}`);
                mostrarMenuAmbientes();
            }
        }

        function mostrarMenuBarrio() {
            let opcionesHTML = '';
            
            // Generar opciones de barrios desde los datos disponibles
            datosDinamicos.barrios.forEach((barrio, index) => {
                const numero = (index + 1).toString();
                opcionesHTML += `
                    <div class="menu-item" onclick="seleccionarOpcion('${numero}')">
                        <span class="menu-number">${numero}</span>${barrio}
                    </div>
                `;
            });
            
            // Agregar opción "Otra zona"
            const numeroOtraZona = (datosDinamicos.barrios.length + 1).toString();
            opcionesHTML += `
                <div class="menu-item" onclick="seleccionarOpcion('${numeroOtraZona}')">
                    <span class="menu-number">${numeroOtraZona}</span>Otra zona
                </div>
            `;
            
            agregarMensajeBot(
                `📍 <strong>¿En qué zona buscás?</strong>`,
                opcionesHTML
            );
            
            const opcionesRapidas = datosDinamicos.barrios.map((_, index) => (index + 1).toString());
            opcionesRapidas.push((datosDinamicos.barrios.length + 1).toString());
            actualizarBotonesRapidos(opcionesRapidas);
        }

        function procesarBarrio(mensaje) {
            const maxOpciones = datosDinamicos.barrios.length + 1; // +1 por "Otra zona"
            const opcionesValidas = Array.from({length: maxOpciones}, (_, i) => (i + 1).toString());
            
            if (opcionesValidas.includes(mensaje)) {
                const indice = parseInt(mensaje) - 1;
                
                if (indice < datosDinamicos.barrios.length) {
                    datosUsuario.barrio = datosDinamicos.barrios[indice];
                    estado = 'precio';
                    agregarMensajeBot(`✅ Zona: ${datosUsuario.barrio}`);
                    mostrarMenuPrecio();
                } else {
                    agregarMensajeBot('📝 Escribí la zona que te interesa:');
                    estado = 'barrio_texto';
                }
            } else {
                agregarMensajeBot(`❌ Por favor, elegí una opción del 1 al ${maxOpciones}`);
                mostrarMenuBarrio();
            }
        }

        function procesarBarrioTexto(mensaje) {
            if (mensaje.trim().length > 0) {
                datosUsuario.barrio = mensaje;
                estado = 'precio';
                agregarMensajeBot(`✅ Zona: ${datosUsuario.barrio}`);
                mostrarMenuPrecio();
            } else {
                agregarMensajeBot('❌ Por favor, escribí la zona que te interesa');
            }
        }

        function mostrarMenuPrecio() {
            // Determinar rangos de precio basados en la operación
            const esVenta = datosUsuario.operacion === 'venta';
            const moneda = esVenta ? 'U$D' : '$';
            
            const rangos = esVenta ? 
                [
                    'Hasta U$D 100.000',
                    'U$D 100.000 - 200.000', 
                    'U$D 200.000 - 500.000',
                    'Más de U$D 500.000'
                ] : [
                    'Hasta $ 100.000',
                    '$ 100.000 - 200.000',
                    '$ 200.000 - 500.000', 
                    'Más de $ 500.000'
                ];
            
            let opcionesHTML = '';
            rangos.forEach((rango, index) => {
                const numero = (index + 1).toString();
                opcionesHTML += `
                    <div class="menu-item" onclick="seleccionarOpcion('${numero}')">
                        <span class="menu-number">${numero}</span>${rango}
                    </div>
                `;
            });
            
            // Agregar opción "Consultar precio"
            const numeroConsultar = (rangos.length + 1).toString();
            opcionesHTML += `
                <div class="menu-item" onclick="seleccionarOpcion('${numeroConsultar}')">
                    <span class="menu-number">${numeroConsultar}</span>Consultar precio
                </div>
            `;
            
            agregarMensajeBot(
                `💰 <strong>¿Qué rango de precio tenés en mente?</strong>`,
                opcionesHTML
            );
            
            const opcionesRapidas = rangos.map((_, index) => (index + 1).toString());
            opcionesRapidas.push((rangos.length + 1).toString());
            actualizarBotonesRapidos(opcionesRapidas);
        }

        // ... (el resto de las funciones se mantienen igual que antes)

        function procesarPrecio(mensaje) {
            const precios = ['1', '2', '3', '4', '5'];
            
            if (precios.includes(mensaje)) {
                datosUsuario.precio = mensaje;
                estado = 'contacto';
                
                agregarMensajeBot(`✅ Rango de precio seleccionado`);
                solicitarContacto();
            } else {
                agregarMensajeBot('❌ Por favor, elegí una opción del 1 al 5');
                mostrarMenuPrecio();
            }
        }

        function solicitarContacto() {
            agregarMensajeBot(
                `📞 <strong>Para contactarte con las mejores opciones, necesito tus datos:</strong><br><br>
                • <strong>Nombre completo</strong><br>
                • <strong>Teléfono</strong><br>
                • <strong>Email</strong><br><br>
                Escribí tus datos en el siguiente formato:<br>
                <code>Nombre - Teléfono - Email</code><br><br>
                <em>Ejemplo: Juan Pérez - 11-1234-5678 - juan@email.com</em>`
            );
            
            actualizarBotonesRapidos([]);
        }

        function procesarContacto(mensaje) {
            // Validación básica de formato
            const partes = mensaje.split('-').map(part => part.trim());
            if (partes.length >= 3) {
                datosUsuario.contacto = mensaje;
                
                // Filtrar propiedades y guardar lead
                propiedadesFiltradas = filtrarPropiedades();
                datosUsuario.propiedadesCoincidentes = propiedadesFiltradas.length;
                guardarLead();
                
                estado = 'final';
                
                agregarMensajeBot(`✅ ¡Perfecto! Tus datos fueron registrados.`);
                mostrarOpcionesFinales();
            } else {
                agregarMensajeBot('❌ Por favor, usá el formato: <strong>Nombre - Teléfono - Email</strong>');
                solicitarContacto();
            }
        }

        function mostrarOpcionesFinales() {
            const opciones = `
                <div class="menu-item" onclick="seleccionarOpcion('1')">
                    <span class="menu-number">1</span>Ver propiedades filtradas (${propiedadesFiltradas.length})
                </div>
                <div class="menu-item" onclick="seleccionarOpcion('2')">
                    <span class="menu-number">2</span>Agendar llamada con asesor
                </div>
                <div class="menu-item" onclick="seleccionarOpcion('3')">
                    <span class="menu-number">3</span>Volver al inicio
                </div>
            `;
            
            agregarMensajeBot(
                `🎉 <strong>¡Listo! Tenemos ${propiedadesFiltradas.length} propiedades que coinciden con tu búsqueda.</strong><br><br>
                Un asesor se contactará contigo pronto.<br><br>
                <strong>¿Qué querés hacer ahora?</strong>`,
                opciones
            );
            
            actualizarBotonesRapidos(['1', '2', '3']);
        }

        function procesarFinal(mensaje) {
            switch (mensaje) {
                case '1':
                    mostrarPropiedadesFiltradas();
                    break;
                case '2':
                    agendarLlamada();
                    break;
                case '3':
                    reiniciarChat();
                    break;
                default:
                    agregarMensajeBot('❌ Por favor, elegí una opción del 1 al 3');
                    mostrarOpcionesFinales();
            }
        }

        function filtrarPropiedades() {
            return propiedades.filter(prop => {
                let coincide = true;
                
                if (datosUsuario.operacion && prop.operacion !== datosUsuario.operacion) {
                    coincide = false;
                }
                
                if (datosUsuario.tipo && prop.tipo !== datosUsuario.tipo) {
                    coincide = false;
                }
                
                // Filtro por barrio si se seleccionó uno específico
                if (datosUsuario.barrio && datosDinamicos.barrios.includes(datosUsuario.barrio) && prop.barrio !== datosUsuario.barrio) {
                    coincide = false;
                }
                
                return coincide;
            });
        }

        function mostrarPropiedadesFiltradas() {
            if (propiedadesFiltradas.length === 0) {
                agregarMensajeBot('❌ No encontré propiedades con esos criterios. Un asesor te contactará para ayudarte.');
                return;
            }
            
            let html = `<div class="results-grid">`;
            
            propiedadesFiltradas.forEach(prop => {
                html += `
                    <div class="property-card">
                        <div class="property-header">
                            <strong>${prop.titulo}</strong>
                            <div style="font-size: 0.8rem; color: #666; margin-top: 0.3rem;">
                                ${prop.barrio} • ${prop.operacion}
                            </div>
                        </div>
                        <div class="property-details">
                            <div>🏠 ${prop.tipo}</div>
                            <div>🛏️ ${prop.ambientes} amb.</div>
                            <div>📏 ${prop.metros_cuadrados}m²</div>
                            <div>💰 ${formatearPrecio(prop)}</div>
                        </div>
                    </div>
                `;
            });
            
            html += `</div>`;
            
            agregarMensajeBot(html);
            mostrarOpcionesFinales();
        }

        function agendarLlamada() {
            agregarMensajeBot(
                `📅 <strong>¡Perfecto! Un asesor te contactará dentro de las próximas 2 horas.</strong><br><br>
                <strong>Datos registrados:</strong><br>
                • Operación: ${datosUsuario.operacion}<br>
                • Tipo: ${datosUsuario.tipo}<br>
                • Ambientes: ${datosUsuario.ambientes}<br>
                • Zona: ${datosUsuario.barrio}<br>
                • Contacto: ${datosUsuario.contacto}<br><br>
                <em>Gracias por confiar en Dante Propiedades 🏠</em>`
            );
        }

        async function guardarLead() {
            try {
                const lead = {
                    ...datosUsuario,
                    timestamp: new Date().toISOString(),
                    id: Date.now().toString()
                };
                
                // Guardar en localStorage (simulación del archivo JSON)
                const leadsExistentes = JSON.parse(localStorage.getItem('dante_leads') || '[]');
                leadsExistentes.push(lead);
                localStorage.setItem('dante_leads', JSON.stringify(leadsExistentes));
                
                console.log('✅ Lead guardado:', lead);
                
            } catch (error) {
                console.error('❌ Error guardando lead:', error);
            }
        }

        function formatearPrecio(prop) {
            if (!prop.precio || prop.precio === 0) return "Consultar";
            const moneda = prop.moneda_precio === 'USD' ? 'U$D' : '$';
            return `${moneda} ${prop.precio.toLocaleString()}`;
        }

        function actualizarBotonesRapidos(opciones) {
            const quickActions = document.getElementById('quickActions');
            quickActions.innerHTML = '';
            
            opciones.forEach(opcion => {
                const btn = document.createElement('button');
                btn.className = 'quick-btn';
                btn.textContent = opcion;
                btn.onclick = () => seleccionarOpcion(opcion);
                quickActions.appendChild(btn);
            });
        }

        function reiniciarChat() {
            estado = 'inicio';
            datosUsuario = {
                operacion: '',
                tipo: '',
                ambientes: '',
                barrio: '',
                precio: '',
                contacto: '',
                propiedadesCoincidentes: 0
            };
            
            document.getElementById('chatMessages').innerHTML = '';
            mostrarMenuInicio();
        }
    </script>
</body>
</html>
